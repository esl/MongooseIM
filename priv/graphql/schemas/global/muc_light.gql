"User's affiliation"
enum Affiliation{
  "Owner of the room"
  OWNER
  "Member of the room"
  MEMBER
  "User doesn't have any affiliation"
  NONE
}

"Specifies blocking data"
input BlockingInput{
  "Type of entity to block"
  entityType: BlockedEntityType!
  "Type of blocking action"
  action: BlockingAction! = DENY
  "Entity's JID"
  entity: JID!
}

"Blocking item data"
type BlockingItem{
  "Type of the entity"
  entityType: BlockedEntityType!
  "Action to be taken"
  action: BlockingAction!
  "Entity's JID"
  entity: JID!
}

"Type of blocking action"
enum BlockingAction{
  "Unblock user/room"
  ALLOW,
  "Block user/room"
  DENY
}

"Type of blocked entity"
enum BlockedEntityType{
  "Individual user"
  USER,
  "MUC Light room"
  ROOM
}

input RoomConfigDictEntryInput{
  "The name of the config option"
  key: String!
  "Config option value"
  value: String!
}

type RoomConfigDictEntry{
  "The name of the config option"
  key: String!
  "Config option value"
  value: String!
}

"Room data"
type Room{
  "Room's JId"
  jid: BareJID!
  "Name of the room"
  name: String
  "Subject of the room"
  subject: String
  "List of participants"
  participants: [RoomUser!]!
  "Configuration options"
  options: [RoomConfigDictEntry!]!
}

"Room user data"
type RoomUser{
  "User's JID"
  jid: JID!
  "User's affiliation"
  affiliation: Affiliation!
}

"MUC Light rooms payload"
type MUCLightRoomsPayload{
  "List of room descriptions, ordered by room JID"
  rooms: [MUCLightRoomDesc!]
  "Total number of rooms in the domain matching the filter"
  count: NonNegInt
  "Whether more rooms exist after this page"
  nextPage: Boolean
}

"MUC Light room description"
type MUCLightRoomDesc{
  "Room's JID"
  jid: BareJID!
  "Room's display name (may be empty)"
  name: String
  "Room's subject (may be empty)"
  subject: String
  "Number of room members"
  usersNumber: NonNegInt
  "JID of one of the room's owners (there is normally exactly one); null if no owner can be resolved"
  ownerJid: JID
}
