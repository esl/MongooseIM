"Configure a new PEP node or require matching settings on an existing node."
input PepPublishOptionsInput {
  "Who can access the node"
  accessModel: PepAccessModel
  "Maximum stored items; 0 disables storage, and \"max\" uses the server limit"
  maxItems: PepMaxItems
}

"Access models supported by PEP nodes"
enum PepAccessModel {
  OPEN
  PRESENCE
}
