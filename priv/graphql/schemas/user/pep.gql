"Manage the authenticated user's own PEP nodes and items."
type PepUserMutation @protected @use(modules: ["mod_pubsub"]) {
  "Create a PEP node with optional configuration"
  createNode(node: NonEmptyString!, config: PepNodeConfigInput): Boolean @use

  "Delete a PEP node and notify subscribers"
  deleteNode(node: NonEmptyString!): Boolean @use

  "Update a PEP node's configuration"
  configure(node: NonEmptyString!, config: PepNodeConfigInput!): Boolean @use

  "Publish or replace a PEP item's XML payload"
  publishItem(
    node: NonEmptyString!
    itemId: NonEmptyString!
    payload: XmlElement!
    publishOptions: PepNodeConfigInput
  ): NonEmptyString @use

  "Remove a PEP item, optionally notifying subscribers"
  retractItem(node: NonEmptyString!, itemId: NonEmptyString!, notify: Boolean = false): Boolean @use
}

"Read the authenticated user's own PEP node configuration and items."
type PepUserQuery @protected @use(modules: ["mod_pubsub"]) {
  "Get a PEP node's configuration"
  getConfiguration(node: NonEmptyString!): PepNodeConfig @use

  "Get a PEP item's XML payload"
  getItem(node: NonEmptyString!, itemId: NonEmptyString!): XmlElement @use
}
