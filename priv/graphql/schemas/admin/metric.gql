"""
Allow admin to get the metric values. Only works with Exometer enabled.
"""
type MetricAdminQuery @protected{
    "Get metric values"
    getMetrics(
      "Name segments, where \"_\" matches any segment. All metrics if omitted"
      name: [String!]
    ): [MetricResult]!
      @protected(type: GLOBAL)
    "Get metric values as key-value pairs"
    getMetricsAsDicts(
      "Name segments, where \"_\" matches any segment. All metrics if omitted"
      name: [String!]
      "Keys to return, e.g. \"count\" or \"99\" for a percentile. All keys if omitted"
      keys: [String!]
    ): [MetricDictResult!]!
      @protected(type: GLOBAL)
    "Get metric values as key-value pairs from cluster nodes"
    getClusterMetricsAsDicts(
      "Name segments, where \"_\" matches any segment. All metrics if omitted"
      name: [String!]
      "Keys to return, e.g. \"count\" or \"99\" for a percentile. All keys if omitted"
      keys: [String!]
      "Nodes to query. All cluster nodes if omitted"
      nodes: [ClusterNodeName!]
    ): [MetricNodeResult]!
      @protected(type: GLOBAL)
}

"""
Result of a metric
"""
enum MetricType {
  "Collects values over a sliding window of 60s and returns appropriate statistical values"
  histogram
  "Returns a number"
  counter
  """
  Provides 2 values: total event count and a value in 60s window.
  Dividing one value by 60 provides an average per-second value over last minute.
  """
  spiral
  "Consists of value and time in milliseconds elapsed from the last metric update"
  gauge
}

"Type of metric result"
union MetricResult = HistogramMetric | CounterMetric | SpiralMetric | GaugeMetric

type HistogramMetric {
  "Metric name"
  name: [String!]!
  "Metric type"
  type: MetricType!
  "The number of values used in the calculation"
  n: Int!
  "Mean value"
  mean: Int!
  "Min value"
  min: Int!
  "Max value"
  max: Int!
  "Median value"
  median: Int!
  "50th percentile"
  p50: Int!
  "75th percentile"
  p75: Int!
  "90th percentile"
  p90: Int!
  "95th percentile"
  p95: Int!
  "99th percentile"
  p99: Int!
  "99.9th percentile"
  p999: Int!
}

type CounterMetric {
  "Metric name"
  name: [String!]!
  "Metric type"
  type: MetricType!
  "The metric value"
  value: SafeInt!
  "Time since last reset"
  ms_since_reset: SafeInt!
}

type GaugeMetric {
  "Metric name"
  name: [String!]!
  "Metric type"
  type: MetricType!
  "The metric value"
  value: SafeInt!
}

type SpiralMetric {
  "Metric name"
  name: [String!]!
  "Metric type"
  type: MetricType!
  "One minute value"
  one: Int!
  "Total value"
  count: SafeInt!
}

type MetricDictEntry {
  "The name of the metric key (i.e. one, count, value)"
  key: String!
  "Metric value"
  value: SafeInt!
}

type MetricDictResult {
  "Metric name"
  name: [String!]!
  "A list of keys and values"
  dict: [MetricDictEntry!]!
}

type MetricNodeResult {
  node: String!
  result: [MetricDictResult!]!
}
